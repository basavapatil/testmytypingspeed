<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TypeForge – AI Typing Trainer</title>
<style>
:root{--bg:#0f1226;--card:#1a1e3d;--tx:#eef0ff;--mu:#9aa0c8;--ac:#7c5cff;--ac2:#18d6a5;--bad:#ff5c7a;--ln:#2b3060;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f2ff;--card:#fff;--tx:#161a3a;--mu:#5a6090;--ln:#dcdffa}}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background-image:radial-gradient(circle at 20% 0,#7c5cff33,transparent 40%),radial-gradient(circle at 90% 30%,#18d6a522,transparent 40%)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--ln)}
nav b{margin-right:auto;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav a{color:var(--mu);text-decoration:none;padding:6px 12px;border-radius:99px;transition:.2s}nav a:hover,nav a.on{background:var(--ac);color:#fff}
#app{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:16px;animation:pop .5s both}
.pop{animation:pop .5s both}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.hero{text-align:center;padding:24px 0}.hero h1{font-size:clamp(28px,6vw,46px);margin:0;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.btn,.chip{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;transition:.2s;margin:3px}.btn:hover,.chip:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.15)}
.chip{background:var(--ln);color:var(--tx)}.btn.g{background:var(--ac2);color:#052}.btn.d{background:var(--bad)}
.mu,small{color:var(--mu)}.bar{display:flex;justify-content:space-between;font-size:20px;margin:8px 0}
.txt{font:22px/1.9 ui-monospace,Consolas,monospace;height:130px;overflow:hidden;background:#0003;padding:10px 14px;border-radius:10px;margin:10px 0}
.txt .ok{color:var(--ac2)}.txt .bad{color:#fff;background:var(--bad);border-radius:3px}.txt .cur{border-left:2px solid var(--ac);animation:bl 1s infinite}@keyframes bl{50%{border-color:transparent}}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#0003;color:var(--tx);font:18px inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#0003;border-radius:12px;padding:12px;text-align:center;animation:pop .6s both}.stat b{display:block;font-size:28px;color:var(--ac2)}
svg{width:100%;height:auto}.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}.fade{animation:pop 2s both}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:left}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--ln)}.yes{background:var(--ac2);color:#052}.no{background:var(--bad);color:#fff}
ol li{margin:6px 0}a{color:var(--ac2)}canvas{width:100%;border-radius:12px;background:#0b0e22;display:block;touch-action:none}
.game-canvas{background:linear-gradient(125deg,#101735,#25205a,#102a42,#101735);background-size:300% 300%;animation:gameGlow 12s ease infinite}
@keyframes gameGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
label{display:block;margin:8px 0 4px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
:root{--bg:#f1ecdf;--card:#fffdf6;--tx:#2d332f;--mu:#6e766e;--ac:#4b6b5b;--ac2:#b96745;--ln:#ddd5c5;--bad:#b84d59;color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1ecdf;--card:#fffdf6;--tx:#2d332f;--mu:#6e766e;--ln:#ddd5c5}}
html{scroll-behavior:smooth}
body{min-height:100vh;background-color:var(--bg);background-image:radial-gradient(ellipse at 12% -8%,#b9674512,transparent 42%),radial-gradient(ellipse at 96% 28%,#4b6b5b12,transparent 36%),linear-gradient(180deg,#f5f0e5,var(--bg));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;background:radial-gradient(circle at 23% 29%,#8d7a5718 0 0.55px,transparent .9px),radial-gradient(circle at 74% 66%,#8d7a5714 0 0.55px,transparent .9px),radial-gradient(circle at 41% 82%,#8d7a5710 0 0.45px,transparent .85px);background-size:13px 15px,19px 21px,11px 17px}
@keyframes ambientDrift{from{transform:translate3d(-1.5%,0,0) scale(1)}to{transform:translate3d(1.5%,-1%,0) scale(1.04)}}
nav{padding:10px max(16px,calc((100vw - 1120px)/2));gap:8px;position:sticky;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-bottom-color:color-mix(in srgb,var(--ln) 75%,transparent)}
nav b{letter-spacing:-.04em}
nav a{font-size:14px;font-weight:650;padding:8px 13px;transition:background .22s ease,color .22s ease,transform .22s ease}
nav a:hover{transform:translateY(-1px)}
#app{max-width:1120px;padding:clamp(16px,3vw,32px);position:relative;z-index:1}
.card{position:relative;overflow:hidden;background:color-mix(in srgb,var(--card) 92%,white);border-color:color-mix(in srgb,var(--ln) 82%,transparent);border-radius:20px;padding:clamp(18px,2.4vw,28px);box-shadow:0 12px 34px #695a3b12;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}
.card:hover{border-color:color-mix(in srgb,var(--ac) 42%,var(--ln));box-shadow:0 18px 42px #695a3b1b}
.grid>.card:hover{transform:translateY(-4px)}
.hero{padding:clamp(32px,7vw,72px) 0 38px}
.hero h1{font-size:clamp(36px,7vw,66px);letter-spacing:-.055em;line-height:1.08;background:linear-gradient(100deg,var(--tx) 20%,#b5a8ff 60%,#7cebd0);-webkit-background-clip:text;background-clip:text;color:transparent;animation:heroEnter .8s cubic-bezier(.2,.8,.2,1) both,heroFloat 5s 1s ease-in-out infinite}
@keyframes heroEnter{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes heroFloat{50%{transform:translateY(-4px)}}
.hero p{max-width:600px;margin:16px auto 0;color:var(--mu);font-size:clamp(16px,2vw,19px);animation:fadeIn .75s .12s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.grid{gap:18px}
.grid>.card:nth-child(2){animation-delay:.06s}.grid>.card:nth-child(3){animation-delay:.12s}.grid>.card:nth-child(4){animation-delay:.18s}.grid>.card:nth-child(5){animation-delay:.24s}.grid>.card:nth-child(6){animation-delay:.3s}
.card h2,.card h3{letter-spacing:-.025em;line-height:1.25}
.card h2{font-size:clamp(22px,3vw,30px)}
.card h3{font-size:clamp(18px,2vw,22px)}
.card p{line-height:1.7}
.btn,.chip{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 17px;border-radius:12px;font-weight:700;text-decoration:none;box-shadow:0 5px 16px #05091418;transition:transform .2s ease,filter .2s ease,box-shadow .2s ease,background .2s ease}
.btn:hover,.chip:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 9px 22px #05091430}
.btn.g{color:#fff}
button,select,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--ac2) 85%,white);outline-offset:3px}
input,select{min-height:46px;border:1px solid var(--ln);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--tx);transition:border-color .2s ease,box-shadow .2s ease}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent);outline:none}
input::placeholder{color:var(--mu);opacity:.72}
label{font-weight:650;color:var(--tx)}
.stats{gap:12px}
.stat{border:1px solid color-mix(in srgb,var(--ln) 70%,transparent);background:color-mix(in srgb,var(--card) 82%,var(--bg));transition:transform .22s ease,border-color .22s ease}
.stat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ac2) 45%,var(--ln))}
.stat b{letter-spacing:-.04em}
.txt{border:1px solid var(--ln);background:color-mix(in srgb,var(--card) 70%,#000);line-height:1.85}
table{border-radius:12px;overflow:hidden}
th{color:var(--mu);font-weight:700}
tbody tr:hover,table tr:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.tag{font-weight:700}
.game-canvas{border:1px solid color-mix(in srgb,var(--ln) 85%,transparent);box-shadow:0 12px 32px #0003}
@media(max-width:620px){nav{justify-content:center;padding:8px;gap:3px}nav b{width:100%;text-align:center;margin:0 0 4px}nav a{padding:7px 9px;font-size:13px}#app{padding:14px}.grid{grid-template-columns:1fr}.row>*{max-width:100%}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<nav><b>⌨ TypeForge</b><a data-p="home" href="#home">Home</a><a data-p="goals" href="#goals">Goals</a><a data-p="test" href="#test">Test</a><a data-p="game" href="#game">Game</a><a data-p="result" href="#result">Result</a><a data-p="history" href="#history">History</a></nav>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),r=n=>Math.floor(Math.random()*n),fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const W="time people world water light house green small large place right under again never every point sound plant earth story young quick brown jump river cloud music dream forge magic stone bridge window garden silver thunder planet rhythm journey keyboard practice fingers accuracy balance steady focus energy motion clever future wonder simple bright castle breeze meadow harvest compass lantern orbit velvet candle puzzle anchor spirit horizon".split(" ");
let H=ld("tt_h",[]),G=ld("tt_g",null),stop=null,gid=0;
function spk(w){try{const b=$("#sp");if(!b||!b.checked||!w)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
// AI coach: adapts word difficulty to recent accuracy
function aiWords(n){const a=H.slice(0,5),acc=a.length?a.reduce((s,x)=>s+x.acc,0)/a.length:90,p=acc>=96?W:W.filter(w=>w.length<=6);return Array.from({length:n},()=>p[r(p.length)])}
function genGoals(){return Array.from({length:10+r(6)},(_,i)=>{const w=[15,20,25,30,40][r(5)],wpm=15+r(10)*5,acc=90+r(9);return{id:"g"+Date.now()+i,words:w,wpm,acc,time:Math.ceil(w*60/wpm)+8}})}
if(!G){G=genGoals();sv("tt_g",G)}
function route(){stop&&stop();stop=null;const[p,a]=location.hash.slice(1).split("/");document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.p==(p||"home")));({home,goals,test,manual,game,result,history:hist}[p||"home"]||home)(a);scrollTo(0,0)}
addEventListener("hashchange",route);
function save(rec){H.unshift(rec);sv("tt_h",H);location.hash="result/"+rec.id}
// ---------- Typing engine ----------
function run(cfg){
 let lwi=0,t=cfg.text,v="",st=0,tot=0,ok=0,last=0,lag=[],ser=[],iv,done=0;
 $("#app").innerHTML=`<div class="card"><h2>${cfg.label}</h2><div class="bar"><b id="tm">${fmt(cfg.time||0)}</b><span id="wc">0 words</span><span id="lw">0 WPM</span></div><div id="txt" class="txt"></div><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Start typing here…"><p class="mu">The timer starts with your first key. The session ends automatically at the word or time limit.</p><label><input id="sp" type="checkbox" checked style="width:auto"> 🔊 Speak each word as you type</label></div>`;
 const inp=$("#inp");inp.focus();setTimeout(()=>spk(t.split(" ")[0]),300);
 const el=()=>(Date.now()-st)/1000,cc=()=>{let n=0;for(let i=0;i<v.length;i++)if(v[i]==t[i])n++;return n},wpm=()=>cc()/5/(Math.max(el(),1)/60);
 function draw(){$("#txt").innerHTML=[...t].map((c,i)=>`<span class="${i<v.length?(v[i]==c?"ok":"bad"):i==v.length?"cur":""}">${c}</span>`).join("");const c=$(".cur");if(c)$("#txt").scrollTop=c.offsetTop-50}
 function upd(){const w=v.trim().split(/\s+/).filter(Boolean).length;$("#wc").textContent=w+(cfg.n?" / "+cfg.n:"")+" words";$("#lw").textContent=(st?wpm():0).toFixed(0)+" WPM"}
 function tick(){const e=el();if(cfg.time){const rm=cfg.time-e;$("#tm").textContent=fmt(Math.max(0,rm));if(rm<=0)return fin()}else $("#tm").textContent=fmt(e);if(Math.floor(e)>ser.length)ser.push(+wpm().toFixed(1));upd()}
 function fin(){if(done)return;done=1;try{speechSynthesis.cancel()}catch(e){}clearInterval(iv);inp.disabled=1;const e=Math.max(el(),1),w=v.trim().split(/\s+/).filter(Boolean).length,full=v.length>=t.length&&(!cfg.time||e<=cfg.time+1),
  rec={id:Date.now(),type:cfg.type,label:cfg.label,wpm:+wpm().toFixed(1),acc:+(tot?ok/tot*100:0).toFixed(1),cps:+(v.length/e).toFixed(2),words:w,chars:v.length,secs:+e.toFixed(1),ser:ser.length?ser:[+wpm().toFixed(1)],lag,arch:0};
  if(cfg.type=="test"||cfg.type=="manual")rec.passed=full;if(cfg.goal){rec.goalId=cfg.goal.id;rec.passed=full&&rec.wpm>=cfg.goal.wpm&&rec.acc>=cfg.goal.acc}save(rec)}
 inp.oninput=()=>{if(done)return;const nv=inp.value;if(!st){st=Date.now();last=st;iv=setInterval(tick,250)}
  if(nv.length>v.length){const i=nv.length-1,n=Date.now();tot++;if(nv[i]==t[i])ok++;lag.push(n-last);last=n}
  v=nv;if(cfg.auto&&v.length>t.length-60)t+=" "+aiWords(40).join(" ");const wi=v.split(" ").length-1;if(wi!=lwi){lwi=wi;spk(t.split(" ")[wi])}draw();upd();if(!cfg.auto&&v.length>=t.length)fin()};
 stop=()=>{clearInterval(iv);done=1;try{speechSynthesis.cancel()}catch(e){}};draw()}
// ---------- Pages ----------
function home(){$("#app").innerHTML=`<div class="hero"><h1>Type faster. Smarter. 🚀</h1><p class="mu">Your AI coach picks the words. You bring the fingers.</p></div><div class="grid">
<div class="card"><h2>✋ Manual mode</h2><p class="mu">AI prepares a set of words for you. Choose your words and time; it finishes automatically.</p><a class="btn" href="#manual">Set up manual test</a></div>
<div class="card"><h2>🤖 Auto mode</h2><p class="mu">The AI agent keeps feeding random words with a countdown timer. Type as many as you can.</p>${[30,60,120].map(n=>`<button class="btn g" onclick="startAuto(${n})">${n} sec</button>`).join("")}</div></div>
<div class="grid"><div class="card"><h3>🎯 Goals</h3><p class="mu">10–15 random challenges.</p><a class="btn" href="#goals">Open goals</a></div><div class="card"><h3>📝 Custom test</h3><p class="mu">Pick words and minutes.</p><a class="btn" href="#test">Take test</a></div><div class="card"><h3>🎮 Typing games</h3><p class="mu">Arcade challenges and a complete cricket match.</p><a class="btn" href="#game">Choose a game</a></div></div>`}
function manual(){$("#app").innerHTML=`<div class="card"><h2>✋ Manual setup</h2><label>Number of words</label><input id="mw" type="number" min="5" max="300" value="25"><label>Time limit (minutes)</label><input id="mt" type="number" min="0.25" step="0.25" value="1"><label>Your own words (optional, leave empty for AI words)</label><input id="mc" placeholder="e.g. apple river bridge"><p class="mu">The session ends automatically when all words are typed or the time runs out, then your result appears. Words are read aloud as you type.</p><button class="btn" onclick="startManual()">Start</button></div>`}
function startManual(){const c=($("#mc").value||"").trim().split(/\s+/).filter(Boolean),n=c.length||Math.max(5,+$("#mw").value||25),m=Math.max(.25,+$("#mt").value||1);run({type:"manual",label:`Manual · ${n} words in ${m} min`,text:(c.length?c:aiWords(n)).join(" "),n,time:Math.round(m*60)})}
function startAuto(s){run({type:"auto",label:"Auto · "+s+" seconds",text:aiWords(120).join(" "),time:s,auto:1})}
function goals(){const rows=G.map(g=>{const d=H.find(x=>x.goalId==g.id&&x.passed),tr=H.find(x=>x.goalId==g.id);return`<div class="card"><div class="row"><div><b>Type ${g.words} words</b> at ${g.wpm}+ WPM, ${g.acc}%+ accuracy within ${fmt(g.time)}<br>${d?`<span class="tag yes">✔ Completed · ${d.wpm} WPM · ${d.acc}% · ${new Date(d.id).toLocaleString()}</span>`:tr?`<span class="tag no">✘ Last try: ${tr.wpm} WPM · ${tr.acc}%</span>`:`<span class="tag">Not attempted</span>`}</div><button class="btn" onclick="startGoal('${g.id}')">${d?"Retry":"Start"}</button></div></div>`}).join("");
 $("#app").innerHTML=`<div class="row"><h2>🎯 Goals (${G.length})</h2><button class="btn g" onclick="G=genGoals();sv('tt_g',G);goals()">🔀 New random goals</button></div>${rows}`}
function startGoal(id){const g=G.find(x=>x.id==id);run({type:"goal",label:`Goal · ${g.words} words @ ${g.wpm} WPM`,text:aiWords(g.words).join(" "),n:g.words,time:g.time,goal:g})}
function test(){$("#app").innerHTML=`<div class="card"><h2>📝 Typing test</h2><label>How many words do you want to type?</label><input id="tw" type="number" min="5" max="300" value="40"><label>Target time (minutes)</label><input id="tmn" type="number" min="0.25" step="0.25" value="1"><p><button class="btn" onclick="const n=Math.max(5,+$('#tw').value||40),m=Math.max(.25,+$('#tmn').value||1);run({type:'test',label:'Test · '+n+' words in '+m+' min',text:aiWords(n).join(' '),n,time:Math.round(m*60)})">Start test</button></p></div>`}
// ---------- Results ----------
let gc=0;
function sm(a,n){if(a.length<=n)return a;const k=a.length/n;return Array.from({length:n},(_,i)=>{const s=a.slice(Math.floor(i*k),Math.floor((i+1)*k)||1);return s.reduce((x,y)=>x+y,0)/s.length})}
function gr(a,col,title,unit){if(!a.length)a=[0,0];if(a.length==1)a=[a[0],a[0]];const w=600,h=170,m=a.length-1,mx=Math.max(...a)*1.15||1,d=a.map((y,i)=>(i?"L":"M")+(i/m*w).toFixed(1)+" "+(h-10-y/mx*(h-20)).toFixed(1)).join(""),id="g"+gc++;
 return`<div class="card"><h3>${title}</h3><svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".4"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${[1,2,3].map(i=>`<line x1="0" x2="${w}" y1="${i*h/4}" y2="${i*h/4}" stroke="var(--ln)"/>`).join("")}<path class="fade" d="${d}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/><path class="ln" pathLength="1" d="${d}" stroke="${col}"/></svg><small>Peak ${Math.max(...a).toFixed(0)} ${unit} · Avg ${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(0)} ${unit}</small></div>`}
function sug(x){const l=x.lag.length?x.lag:[200],av=l.reduce((a,b)=>a+b,0)/l.length,sd=Math.sqrt(l.reduce((a,b)=>a+(b-av)**2,0)/l.length),s=[];
 if(x.acc<92)s.push("Accuracy is "+x.acc+"%. Slow down about 10–15% until you stay above 95%; clean typing becomes fast typing.");
 if(x.acc>=96&&x.wpm<60)s.push("Your accuracy is strong. Push the pace 5% per session; mistakes are cheap while you are still above 95%.");
 if(sd>av*.8)s.push("Your key rhythm is uneven (spikes up to "+Math.max(...l)+" ms). Practice with a steady metronome beat at 60–80 BPM.");
 if(x.wpm<30)s.push("Drill the home row (ASDF JKL;) for 10 minutes daily before tackling full words.");
 if(x.cps<4)s.push("You type "+x.cps+" chars/sec. Read two words ahead so your fingers never wait for your eyes.");
 s.push("Keep your eyes on the screen, never the keyboard. Cover your hands with a cloth for one drill a day.","Sit with elbows at 90° and wrists floating. Good posture prevents fatigue and slowdowns.","Three short 10-minute sessions beat one long session. Consistency builds muscle memory.","Re-type every missed word slowly three times, then once at full speed.","Take a 30-second break every 10 minutes to avoid tension and keep accuracy high.");return s.slice(0,5)}
function vids(x){const q=x.acc<93?["typing accuracy drills","touch typing correct finger placement"]:["increase typing speed 100 wpm","typing rhythm and speed tips"];q.push("touch typing full course beginner to advanced");return q.map(s=>`<li><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s)}">▶ ${s[0].toUpperCase()+s.slice(1)}</a></li>`).join("")}
